<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0075C1">
<title>薩摩川内市 店舗看板意匠 解剖図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&display=swap" rel="stylesheet">
<style>
/* ============ 基本 ============ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#111;-webkit-text-size-adjust:100%}
img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
/* スマホ幅が基準。PCでは中央に細長く表示 */
.page{max-width:560px;margin:0 auto;background:#fff;overflow:hidden}

/* ============ 表紙 ============ */
.cover{
  position:relative;aspect-ratio:522/735;background:#0075C1;
  container-type:inline-size;overflow:hidden;color:#fff;
  -webkit-tap-highlight-color:transparent;
}
.col{
  position:absolute;top:4.1%;display:flex;flex-direction:column;
  font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  font-weight:800;line-height:1;
}
.col .ch{display:block;width:1em;height:1em;text-align:center;will-change:transform;cursor:default}
.col-city{left:63.6%;font-size:8.4cqw;color:#000}   /* 薩摩川内市 */
.col-main{left:46.7%;font-size:17cqw}               /* 店舗看板意匠 */
.col-sub {left:29.5%;font-size:17cqw}               /* 解剖図鑑 */
.presented{
  position:absolute;left:36.6%;top:92%;margin:0;
  font:2.2cqw/1.25 Georgia,"Times New Roman",serif;color:#fff;
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ 見開き（記事） ============
   基準サイズ 842 x 596。各レイヤーは --x --y --w（基準px）で配置する。 */
.spread{position:relative;aspect-ratio:842/596;overflow:hidden;background:#087169}
.layer{
  position:absolute;
  left:calc(var(--x) / 842 * 100%);
  top:calc(var(--y) / 596 * 100%);
  width:calc(var(--w) / 842 * 100%);
  will-change:transform;
}
.layer img{width:100%;height:auto}
.layer.box{height:calc(var(--h) / 596 * 100%)}

/* 未制作の記事枠（あとで差し替え） */
.spread.placeholder{background:var(--c)}

/* ============ 配置確認モード：URLの末尾に ?debug を付ける ============ */
body.debug .layer{outline:1px dashed #ff00cc}
body.debug .layer::after{
  content:attr(data-name);position:absolute;left:0;top:0;z-index:99;
  font:700 9px/1.2 monospace;background:#ff00cc;color:#fff;padding:1px 3px;white-space:nowrap;
}
</style>
</head>
<body>
<main class="page">

  <!-- ================= 表紙 ================= -->
  <header class="cover" id="cover">
    <h1 class="sr-only">薩摩川内市 店舗看板意匠 解剖図鑑</h1>
    <div class="col col-city" data-text="薩摩川内市" aria-hidden="true"></div>
    <div class="col col-main" data-text="店舗看板意匠" aria-hidden="true"></div>
    <div class="col col-sub"  data-text="解剖図鑑"     aria-hidden="true"></div>
    <p class="presented">presented by<br>Sendaishoko high school<br>Tokumaru Kanade</p>
  </header>

  <!-- ================= 記事1：鹿タリヤン =================
       data-depth：パララックスの強さ。0=動かない／マイナス=手前（速く動く）／プラス=奥（遅く動く）
       data-name ：?debug のとき画面に出る名前（素材ファイル名） -->
  <section class="spread" id="tariyan" aria-label="鹿タリヤン">
    <div class="layer" data-name="bg_tariyan_02" data-depth="0.1"  style="--x:-32;--y:-12;--w:960"><img src="images/bg_tariyan_02.png" alt="" loading="lazy" decoding="async"></div>
    <div class="layer" data-name="bg_tariyan_01" data-depth="0"    style="--x:0;--y:0;--w:421"><img src="images/bg_tariyan_01.png" alt="鹿タリヤンの外観" loading="lazy" decoding="async"></div>
    <div class="layer box" data-name="bar(CSS)"  data-depth="0"    style="--x:0;--y:0;--w:40;--h:596;background:#BD965D"></div>
    <div class="layer" data-name="kanji_shika"   data-depth="-0.1" style="--x:40;--y:0;--w:145"><img src="images/kanji_shika.png" alt="鹿" loading="lazy" decoding="async"></div>

    <div class="layer" data-name="bg_tariyan_03" data-depth="-0.2" style="--x:401;--y:-53;--w:168"><img src="images/bg_tariyan_03.png" alt="" loading="lazy" decoding="async"></div>
    <div class="layer" data-name="bg_tariyan_04" data-depth="0"    style="--x:689;--y:-1;--w:167"><img src="images/bg_tariyan_04.png" alt="" loading="lazy" decoding="async"></div>
    <div class="layer box" data-name="tealbox(CSS)" data-depth="0" style="--x:681;--y:20;--w:64;--h:65;background:#087169"></div>

    <div class="layer" data-name="topic_tariyan_01_" data-depth="-0.12" style="--x:553;--y:20;--w:128"><img src="images/topic_tariyan_01_.png" alt="流れが生む統一感" loading="lazy" decoding="async"></div>
    <div class="layer" data-name="bg_tariyan_05" data-depth="-0.25" style="--x:433;--y:256;--w:263"><img src="images/bg_tariyan_05.png" alt="" loading="lazy" decoding="async"></div>
    <div class="layer" data-name="topic_tariyan_02" data-depth="-0.12" style="--x:533;--y:103;--w:169"><img src="images/topic_tariyan_02.png" alt="名前の由来" loading="lazy" decoding="async"></div>
    <div class="layer" data-name="topic_tariyan_03" data-depth="-0.12" style="--x:444;--y:191;--w:127"><img src="images/topic_tariyan_03.png" alt="一文字の力強さ" loading="lazy" decoding="async"></div>
    <div class="layer" data-name="topic_tariyan_06" data-depth="0"     style="--x:639;--y:407;--w:251"><img src="images/topic_tariyan_06.png" alt="看板の作りについて" loading="lazy" decoding="async"></div>
    <div class="layer" data-name="topic_tariyan_04" data-depth="-0.12" style="--x:566;--y:359;--w:85"><img src="images/topic_tariyan_04.png" alt="看板の解説" loading="lazy" decoding="async"></div>
    <div class="layer" data-name="bg_tariyan_07" data-depth="-0.5"  style="--x:446;--y:343;--w:101"><img src="images/bg_tariyan_07.png" alt="" loading="lazy" decoding="async"></div>
    <div class="layer" data-name="bg_tariyan_08" data-depth="-0.25" style="--x:411;--y:448;--w:210"><img src="images/bg_tariyan_08.png" alt="" loading="lazy" decoding="async"></div>
    <div class="layer" data-name="topic_tariyan_05" data-depth="-0.12" style="--x:540;--y:442;--w:127"><img src="images/topic_tariyan_05.png" alt="素材が生む温もり" loading="lazy" decoding="async"></div>
    <div class="layer" data-name="bg_tariyan_06" data-depth="-0.4"  style="--x:672;--y:119;--w:157"><img src="images/bg_tariyan_06.png" alt="鹿タリヤンの看板" loading="lazy" decoding="async"></div>
  </section>

  <!-- ================= 記事2：かっぱ亭（素材待ち） ================= -->
  <section class="spread placeholder" id="kappatei" style="--c:#2F7F88" aria-label="かっぱ亭"></section>

  <!-- ================= 未制作の記事枠（あとで差し替え） ================= -->
  <section class="spread placeholder" style="--c:#009944" aria-hidden="true"></section>
  <section class="spread placeholder" style="--c:#00A1E9" aria-hidden="true"></section>
  <section class="spread placeholder" style="--c:#E4007F" aria-hidden="true"></section>

</main>

<script>
(function(){
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (/[?&]debug\b/.test(location.search)) document.body.classList.add('debug');

  /* ---------- 表紙の文字を1文字ずつ作る ---------- */
  document.querySelectorAll('.col[data-text]').forEach(function(col){
    Array.from(col.dataset.text).forEach(function(t){
      var s = document.createElement('span'); s.className = 'ch'; s.textContent = t; col.appendChild(s);
    });
  });

  /* ---------- 表紙：触れると文字が散って、ばねで戻る ---------- */
  var cover = document.getElementById('cover');
  var chars = Array.from(cover.querySelectorAll('.ch')).map(function(el){
    return {el:el,cx:0,cy:0,x:0,y:0,r:0,vx:0,vy:0,vr:0};
  });
  var W = 390, ptr = null, raf = 0;

  function measure(){
    chars.forEach(function(c){ c.x=c.y=c.r=c.vx=c.vy=c.vr=0; c.el.style.transform='none'; });
    var cr = cover.getBoundingClientRect(); W = cr.width || 390;
    chars.forEach(function(c){
      var b = c.el.getBoundingClientRect();
      c.cx = b.left - cr.left + b.width/2; c.cy = b.top - cr.top + b.height/2;
    });
  }
  function local(cx,cy){ var r = cover.getBoundingClientRect(); return {x:cx-r.left,y:cy-r.top}; }

  function step(){
    var u = W/390, R = W*0.24, moving = false;
    chars.forEach(function(c){
      if (ptr){
        var dx = c.cx + c.x - ptr.x, dy = c.cy + c.y - ptr.y, d = Math.hypot(dx,dy) || 1;
        if (d < R){
          var f = 1 - d/R, s = f*f*2.6*u;
          c.vx += dx/d*s; c.vy += dy/d*s; c.vr += (dx>0?1:-1)*f*0.9;
        }
      }
      c.vx -= c.x*0.06; c.vy -= c.y*0.06; c.vr -= c.r*0.06;
      c.vx *= 0.84; c.vy *= 0.84; c.vr *= 0.84;
      c.x += c.vx; c.y += c.vy; c.r += c.vr;
      if (Math.abs(c.x)+Math.abs(c.y)+Math.abs(c.r) > 0.05 || Math.abs(c.vx)+Math.abs(c.vy) > 0.05) moving = true;
      c.el.style.transform = 'translate3d('+c.x.toFixed(2)+'px,'+c.y.toFixed(2)+'px,0) rotate('+c.r.toFixed(2)+'deg)';
    });
    raf = (moving || ptr) ? requestAnimationFrame(step) : 0;
  }
  function kick(){ if (!raf) raf = requestAnimationFrame(step); }
  function burst(p){
    var u = W/390, R = W*0.4;
    chars.forEach(function(c){
      var dx = c.cx - p.x, dy = c.cy - p.y, d = Math.hypot(dx,dy) || 1;
      if (d < R){ var f = 1 - d/R; c.vx += dx/d*14*u*f; c.vy += dy/d*14*u*f; c.vr += (dx>0?1:-1)*10*f; }
    });
  }

  if (!reduce){
    cover.addEventListener('pointermove', function(e){ if (e.pointerType==='touch') return; ptr = local(e.clientX,e.clientY); kick(); });
    cover.addEventListener('pointerleave', function(e){ if (e.pointerType==='touch') return; ptr = null; kick(); });
    cover.addEventListener('pointerdown', function(e){ if (e.pointerType==='touch') return; burst(local(e.clientX,e.clientY)); kick(); });
    cover.addEventListener('touchstart', function(e){ var t=e.touches[0]; ptr = local(t.clientX,t.clientY); burst(ptr); kick(); }, {passive:true});
    cover.addEventListener('touchmove',  function(e){ var t=e.touches[0]; ptr = local(t.clientX,t.clientY); kick(); }, {passive:true});
    ['touchend','touchcancel'].forEach(function(n){ cover.addEventListener(n, function(){ ptr = null; kick(); }, {passive:true}); });
  }
  measure();
  window.addEventListener('resize', measure);
  window.addEventListener('load', measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

  /* ---------- 見開き：スクロールに合わせたパララックス ---------- */
  if (reduce) return;
  var spreads = Array.from(document.querySelectorAll('.spread'));
  var visible = new Set(), ticking = false;
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if (e.isIntersecting) visible.add(e.target); else visible.delete(e.target); });
    request();
  }, {rootMargin:'20% 0px'});
  spreads.forEach(function(s){ io.observe(s); });

  function update(){
    ticking = false;
    var vh = window.innerHeight;
    visible.forEach(function(sp){
      var r = sp.getBoundingClientRect();
      var p = (r.top + r.height/2 - vh/2) / (vh/2 + r.height/2);   // 下に居る=+1 ／ 上に抜けた=-1
      p = Math.max(-1, Math.min(1, p));
      var amp = r.width * 0.09;
      sp.querySelectorAll('.layer').forEach(function(l){
        var d = parseFloat(l.dataset.depth || 0);
        if (d) l.style.transform = 'translate3d(0,'+(p*d*amp).toFixed(1)+'px,0)';
      });
    });
  }
  function request(){ if (!ticking){ ticking = true; requestAnimationFrame(update); } }
  window.addEventListener('scroll', request, {passive:true});
  window.addEventListener('resize', request);
  request();
})();
</script>
</body>
</html>
